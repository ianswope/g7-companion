name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: tray
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - run: cargo test --locked
      - run: |
          cargo build --locked --release --target aarch64-apple-darwin
          cargo build --locked --release --target x86_64-apple-darwin
      - name: Bundle universal app
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          app="dist/G7 Companion.app"
          mkdir -p "$app/Contents/MacOS"
          sed "s/__VERSION__/$version/g" packaging/macos/Info.plist > "$app/Contents/Info.plist"
          for bin in g7-companion g7; do
            lipo -create -output "$app/Contents/MacOS/$bin" \
              "target/aarch64-apple-darwin/release/$bin" "target/x86_64-apple-darwin/release/$bin"
          done
          # Ad-hoc signature: required to run on Apple Silicon. Not notarized.
          codesign --force --deep --sign - "$app"
          (cd dist && ditto -c -k --keepParent "G7 Companion.app" "G7-Companion-$version-macOS.zip")
          shasum -a 256 "dist/G7-Companion-$version-macOS.zip"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos
          path: tray/dist/*.zip
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: tray
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: cargo test --locked
      - run: cargo build --locked --release
      - name: Package
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          mkdir -p "dist/G7 Companion"
          cp target/release/g7-companion.exe target/release/g7.exe "dist/G7 Companion/"
          cp ../LICENSE "dist/G7 Companion/LICENSE.txt"
          cd dist && 7z a "G7-Companion-$version-Windows-x64.zip" "G7 Companion" > /dev/null
          sha256sum "G7-Companion-$version-Windows-x64.zip"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows
          path: tray/dist/*.zip
          if-no-files-found: error

  release:
    needs: [macos, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd dist
          sha256sum *.zip > SHA256SUMS.txt
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "G7 Companion $GITHUB_REF_NAME" \
            --notes "Downloads for macOS (Apple Silicon and Intel) and Windows 10/11. See the README for first-run steps: neither build is signed by Apple or Microsoft yet, so each OS asks once before opening it." \
            *.zip SHA256SUMS.txt
