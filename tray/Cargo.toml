[package]
name = "g7-companion"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
license = "MIT"
description = "Dexcom G7 glucose reading in the menu bar or system tray, for anyone following someone's CGM."
repository = "https://github.com/ianswope/g7-companion"
publish = false

[lib]
name = "g7"
path = "src/lib.rs"

[[bin]]
name = "g7"
path = "src/bin/g7.rs"

[[bin]]
name = "g7-companion"
path = "src/bin/g7-companion.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", default-features = false, features = ["tls"] }
dirs = "7"
keyring = { version = "4", default-features = false, features = ["v1"] }
rpassword = "7"
tray-icon = "0.26"
tao = "0.37"

[target.'cfg(target_os = "windows")'.dependencies]
winreg = "0.56"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
